<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark purple background -->
  <rect width="500" height="500" fill="#1e1b4b"/>

  <!-- Headphone icon -->
  <g transform="translate(150, 120)" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Headband -->
    <path d="M20 100 C20 40, 80 0, 100 0 C120 0, 180 40, 180 100"/>
    <!-- Left ear cup -->
    <rect x="0" y="85" width="40" height="60" rx="8" fill="#a855f7"/>
    <!-- Right ear cup -->
    <rect x="160" y="85" width="40" height="60" rx="8" fill="#a855f7"/>
  </g>

  <!-- Sound wave bars -->
  <g transform="translate(250, 280)" fill="#9333ea">
    <rect x="-60" y="-30" width="8" height="60" rx="4"/>
    <rect x="-40" y="-45" width="8" height="90" rx="4"/>
    <rect x="-20" y="-20" width="8" height="40" rx="4"/>
    <rect x="0" y="-50" width="8" height="100" rx="4"/>
    <rect x="20" y="-25" width="8" height="50" rx="4"/>
    <rect x="40" y="-40" width="8" height="80" rx="4"/>
    <rect x="60" y="-30" width="8" height="60" rx="4"/>
  </g>

  <!-- Video Transcriber text -->
  <text x="250" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">
    Video Transcriber
  </text>
</svg>